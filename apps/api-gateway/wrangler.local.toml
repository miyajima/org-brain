name = "open-brain-api-gateway-local"
main = "src/index.ts"
compatibility_date = "2026-03-03"
compatibility_flags = ["nodejs_compat"]

[vars]
HYBRID_V3_MODE = "off"
HYBRID_V4_MODE = "shadow"
HYBRID_V4_SHADOW_SAMPLE_RATE = "0.05"
ORGBRAIN_MEMORY_CAPTURE_V2_MODE = "off"
ORGBRAIN_UNCONFIRMED_DECISION_BLOCKING = "off"
MEMORY_CLASSIFICATION_MODE = "observe"
RETRIEVAL_GENERATION_ROUTING = "legacy"
RETENTION_SWEEP_MODE = "observe"

# AI and Vectorize are intentionally omitted here. Wrangler cannot emulate
# those bindings locally; declaring them makes the CI smoke require remote
# credentials or expose bindings that fail when called.

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1002"
[ratelimits.simple]
limit = 1500
period = 60

[[d1_databases]]
binding = "OPEN_BRAIN_DB"
database_name = "open-brain"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "OPEN_BRAIN_BUCKET"
bucket_name = "open-brain-bucket"

[[queues.producers]]
binding = "ORG_BUS_OUT"
queue = "org-bus"

[[queues.producers]]
binding = "RETRIEVAL_PROJECTION_QUEUE"
queue = "orgbrain-retrieval-projection-v3"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OrgBrainMCP"]

[[migrations]]
tag = "v2"
deleted_classes = ["OrgBrainMCP"]
