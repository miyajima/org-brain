name = "open-brain-api-gateway"
main = "src/index.ts"
compatibility_date = "2026-03-03"
compatibility_flags = ["nodejs_compat"]

[vars]
HYBRID_V3_MODE = "shadow"
HYBRID_V4_MODE = "shadow"

[ai]
binding = "AI"
#
# [[vectorize]]
# binding = "MEMORY_VECTOR_INDEX"
# index_name = "orgbrain-memory-384-cosine"

[[vectorize]]
binding = "MEMORY_VECTOR_INDEX_V3"
index_name = "orgbrain-memory-units-v3-1024"

# Optional authenticated API rate limiting. Choose an account-unique positive
# integer namespace before enabling.
# [[ratelimits]]
# name = "API_RATE_LIMITER"
# namespace_id = "1001"
# [ratelimits.simple]
# limit = 1500
# period = 60

[[d1_databases]]
binding = "OPEN_BRAIN_DB"
database_name = "open-brain"
database_id = "0a34b2a0-27f8-4d18-9a12-8ef218670842"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "OPEN_BRAIN_BUCKET"
bucket_name = "open-brain-bucket"

[[queues.producers]]
binding = "ORG_BUS_OUT"
queue = "org-bus"

[[queues.producers]]
binding = "RETRIEVAL_PROJECTION_QUEUE"
queue = "orgbrain-retrieval-projection-v3"

[durable_objects]
bindings = [
  { name = "MCP_OBJECT", class_name = "OrgBrainMCP" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["OrgBrainMCP"]
