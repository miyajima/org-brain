name = "open-brain-cap-runner"
main = "src/index.ts"
compatibility_date = "2026-03-03"
compatibility_flags = ["nodejs_compat"]

[vars]
SKILL_GENERATION_PROVIDERS_JSON = "[]"
METRIC_IMPORT_MODE = "off"
KNOWLEDGE_LOOP_PREVIEW_WRITE_TENANTS_JSON = "[]"

[[d1_databases]]
binding = "OPEN_BRAIN_DB"
database_name = "open-brain"

[[r2_buckets]]
binding = "OPEN_BRAIN_BUCKET"
bucket_name = "open-brain-bucket"

[[queues.producers]]
binding = "ORG_BUS_OUT"
queue = "org-bus"

[[queues.producers]]
binding = "METRIC_IMPORT_QUEUE"
queue = "orgbrain-metric-import-v1"

[[queues.consumers]]
queue = "cap-plan"
max_batch_size = 5
max_batch_timeout = 5
dead_letter_queue = "cap-plan-dlq"
max_retries = 5

[[queues.consumers]]
queue = "orgbrain-metric-import-v1"
max_batch_size = 5
max_batch_timeout = 5
dead_letter_queue = "orgbrain-metric-import-v1-dlq"
max_retries = 3

[durable_objects]
bindings = [
  { name = "LEASES", class_name = "LeaseDO" },
  { name = "MAILBOX", class_name = "MailboxDO" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LeaseDO", "MailboxDO"]

[triggers]
crons = ["*/5 * * * *", "5 0 * * *", "30 18 * * *"]
