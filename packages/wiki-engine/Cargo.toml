[package]
name = "orgbrain-wiki-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = "0.4"
pulldown-cmark = "0.13"
regex = "1"
rusqlite = { version = "0.40", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlite-vec = "0.1"
tempfile = "3"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

