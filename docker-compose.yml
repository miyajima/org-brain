services:
  orgbrain:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["serve", "--host", "0.0.0.0", "--port", "8788"]
    environment:
      ORGBRAIN_ALLOW_NON_LOOPBACK: "1"
    ports:
      - "127.0.0.1:8788:8788"
    volumes:
      - orgbrain-data:/data
    restart: unless-stopped

volumes:
  orgbrain-data:
